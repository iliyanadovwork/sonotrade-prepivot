version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: sonotrade-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: sonotrade
    volumes:
      - mongodb_data:/data/db
    networks:
      - sonotrade-network

volumes:
  mongodb_data:
    driver: local

networks:
  sonotrade-network:
    driver: bridge










